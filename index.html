<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>144 Square Test</title>
<style>
:root{--bg:#f3f0ff;--card:#fff;--text:#3b3a5a;--accent:#8e7cf0;--accent2:#7bc6e8;--head:#dcd4ff;--ok:#bdeccb;--bad:#ffc9c9;--line:#e3ddff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25233a;--card:#312f4d;--text:#ece9ff;--head:#4a4580;--ok:#2f6b47;--bad:#7a3a46;--line:#444068}}
:root[data-theme="dark"]{--bg:#25233a;--card:#312f4d;--text:#ece9ff;--head:#4a4580;--ok:#2f6b47;--bad:#7a3a46;--line:#444068}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Trebuchet MS",Verdana,sans-serif;padding:12px}
header{max-width:760px;margin:0 auto 14px;background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:0 4px 14px #8e7cf022;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.5rem;color:var(--accent)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{font-weight:700}
#mins{width:70px;padding:8px;border-radius:12px;border:2px solid var(--line);font-size:1rem;text-align:center;background:var(--bg);color:var(--text);font-family:inherit}
button{border:0;border-radius:14px;padding:10px 18px;font-size:1rem;font-weight:800;font-family:inherit;cursor:pointer;color:#fff}
#start{background:var(--accent)}#cancel{background:var(--accent2)}
button:disabled{opacity:.4;cursor:not-allowed}
#nm{width:130px;padding:8px;border-radius:12px;border:2px solid var(--line);font-size:1rem;background:var(--bg);color:var(--text);font-family:inherit}
#nm:disabled,#mins:disabled{opacity:.6}
#rank{display:none;margin-top:16px;text-align:left}
#rank h2{margin:0 0 8px;font-size:1.2rem;text-align:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
th{background:var(--head)}td.n{text-align:left}
tr.me td{background:var(--ok);font-weight:800}
#clock{font-size:1.7rem;font-weight:800;min-width:90px;text-align:center;background:var(--head);border-radius:14px;padding:4px 12px;font-variant-numeric:tabular-nums}
main{display:flex;gap:12px;align-items:flex-start;max-width:900px;margin:0 auto;background:var(--card);border-radius:22px;padding:12px;box-shadow:0 4px 14px #8e7cf022}
#grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.h{background:var(--head);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;aspect-ratio:1;font-size:clamp(.7rem,2.6vw,1.1rem)}
.h.corner{background:var(--accent);color:#fff}
input.c{width:100%;aspect-ratio:1;min-width:0;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:clamp(.7rem,2.6vw,1.1rem);font-family:inherit;color:var(--text);background:var(--bg);padding:0}
input.c:disabled{opacity:.7}
input.c:focus{outline:none;border-color:var(--accent);background:var(--card)}
input.c.ok{background:var(--ok)}input.c.bad{background:var(--bad)}
#pad{display:none;position:sticky;top:12px;width:170px;grid-template-columns:repeat(3,1fr);gap:8px}
main.run #pad{display:grid}
#pad button{padding:0;height:54px;font-size:1.4rem;background:var(--head);color:var(--text);border-radius:14px;touch-action:manipulation}
#pad button:active{background:var(--accent);color:#fff}
#pad .del{background:var(--bad)}#pad .ent{background:var(--accent);color:#fff}
@media (max-width:640px){
 body{padding-bottom:150px}
 main{display:block}
 #pad{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:9;background:var(--card);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(6,1fr);box-shadow:0 -4px 14px #8e7cf033}
 #pad button{height:48px}
}
#result{max-width:760px;margin:14px auto 0;background:var(--card);border-radius:22px;padding:14px 18px;text-align:center;box-shadow:0 4px 14px #8e7cf022}
#score{font-size:2rem;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>🔢 144 Square Test</h1>
  <div class="ctl">
    <label for="mins">Minutos:</label>
    <input id="mins" type="number" min="1" max="120" step="1" value="10">
    <label for="nm">Nombre:</label>
    <input id="nm" maxlength="20" placeholder="Tu nombre" autocomplete="off">
    <button id="start">▶ Comenzar</button>
    <button id="cancel" disabled>Terminar</button>
    <div id="clock">00:00</div>
  </div>
</header>
<main id="main"><div id="grid"></div><div id="pad" aria-label="Teclado numérico"></div></main>
<section id="result"><div>Puntuación</div><div id="score">– / 144</div><div id="msg">¡Completa la tabla de multiplicar!</div>
  <div id="rank"><h2>🏆 Mejores puntuaciones</h2><div class="tw"><table id="tb"></table></div></div></section>
<script>
const grid=document.getElementById('grid'),cells=[];let cur=null;
const $=id=>document.getElementById(id);
function mk(t,c){const d=document.createElement('div');d.className='h '+(c||'');d.textContent=t;grid.appendChild(d)}
mk('×','corner');for(let c=1;c<=12;c++)mk(c);
for(let r=1;r<=12;r++){mk(r);for(let c=1;c<=12;c++){
  const i=document.createElement('input');i.className='c';i.disabled=true;i.inputMode='none';i.addEventListener('focus',()=>{cur=i});i.maxLength=3;
  i.dataset.a=r*c;i.setAttribute('aria-label',r+' por '+c);
  i.addEventListener('input',()=>{i.value=i.value.replace(/\D/g,'')});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const n=cells[cells.indexOf(i)+1];n&&n.focus()}});
  grid.appendChild(i);cells.push(i)}}
const pad=$('pad');
[1,2,3,4,5,6,7,8,9,'⌫',0,'⏎'].forEach(k=>{
  const b=document.createElement('button');b.textContent=k;b.type='button';
  b.className=k==='⌫'?'del':k==='⏎'?'ent':'';
  b.setAttribute('aria-label',k==='⌫'?'Borrar':k==='⏎'?'Siguiente':k);
  b.addEventListener('pointerdown',e=>e.preventDefault());
  b.addEventListener('click',()=>{
    if(state!=='running')return;
    if(!cur)cur=cells[0];
    if(k==='⌫')cur.value=cur.value.slice(0,-1);
    else if(k==='⏎'){const n=cells[cells.indexOf(cur)+1];if(n){n.focus({preventScroll:false})}}
    else if(cur.value.length<3)cur.value+=k;
    if(k!=='⏎')cur.focus({preventScroll:true})});
  pad.appendChild(b)});
// URL del Apps Script (ver instrucciones). Si está vacío, el ranking se guarda solo en este dispositivo.
const ENDPOINT='https://script.google.com/macros/s/AKfycbzhxQ946caYfsEXJ9NsGxYblPqtVYnaerAYxsnRT_EQJl34czhFDHhXwkKro2j16-Qydw/exec';
let rows=[],mineKey=null,shown=false,pname='',startMs=0,totalMs=0;
const LS='sq144_rank',cmp=(a,b)=>(b.score-a.score)||(a.secs-b.secs)||String(a.date).localeCompare(String(b.date));
const key=r=>r.name+'|'+r.score+'|'+r.secs;
const lsLoad=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}};
const lsSave=a=>{try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){}};
async function load(){
  let a=[];
  if(ENDPOINT){try{a=await(await fetch(ENDPOINT+(ENDPOINT.includes('?')?'&':'?')+'t='+Date.now())).json()}catch(e){a=[]}}
  else a=lsLoad();
  rows=(Array.isArray(a)?a:[]).filter(r=>r&&r.name&&isFinite(r.score)).map(r=>({...r,score:+r.score,secs:+r.secs||0})).sort(cmp).slice(0,25);
}
async function addEntry(e){
  mineKey=key(e);
  if(ENDPOINT){try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(e)})}catch(x){}}
  else{const a=lsLoad();a.push(e);a.sort(cmp);lsSave(a.slice(0,200))}
  await load();
}
function render(){
  const tb=$('tb');tb.textContent='';
  const hr=tb.insertRow();['#','Fecha','Nombre','Puntos','Tiempo'].forEach(t=>{const th=document.createElement('th');th.textContent=t;hr.appendChild(th)});
  let found=false;
  rows.forEach((r,i)=>{
    const tr=tb.insertRow();if(!found&&key(r)===mineKey){tr.className='me';found=true}
    const f=new Date(r.date);
    [i+1,isNaN(f)?'':f.toLocaleDateString('es-ES'),r.name,r.score,fmt(r.secs)].forEach((v,j)=>{const td=tr.insertCell();td.textContent=v;if(j===2)td.className='n'})});
  $('rank').style.display=shown?'block':'none';
}
let timer=null,end=0,state='idle';
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){const left=Math.max(0,Math.ceil((end-Date.now())/1000));$('clock').textContent=fmt(left);if(left<=0)finish()}
$('start').onclick=()=>{
  const m=parseFloat($('mins').value);if(!(m>0)){alert('Introduce un tiempo válido en minutos.');return}
  pname=$('nm').value.trim();if(!pname){alert('Escribe tu nombre para empezar.');$('nm').focus();return}
  state='running';startMs=Date.now();totalMs=m*60000;end=startMs+totalMs;$('nm').disabled=true;
  cells.forEach(c=>{c.disabled=false});$('main').classList.add('run');cells[0].focus();
  $('start').disabled=true;$('mins').disabled=true;$('cancel').disabled=false;$('cancel').textContent='Terminar';
  $('msg').textContent='¡Tú puedes! ⏳';tick();timer=setInterval(tick,250)};
function finish(){
  if(state!=='running')return;
  clearInterval(timer);state='done';$('main').classList.remove('run');cur=null;let ok=0;
  cells.forEach(c=>{c.disabled=true;const good=c.value!==''&&+c.value===+c.dataset.a;c.classList.add(good?'ok':'bad');if(good)ok++});
  $('score').textContent=ok+' / 144';
  $('msg').textContent=ok===144?'¡Perfecto! 🏆':ok>=100?'¡Muy bien! 🌟':ok>=50?'¡Buen trabajo, sigue practicando! 💪':'¡Sigue practicando, cada vez saldrá mejor! 🌱';
  $('cancel').textContent='Reiniciar';$('cancel').disabled=false;
  const secs=Math.min(Math.round((Date.now()-startMs)/1000),Math.round(totalMs/1000));
  addEntry({date:new Date().toISOString(),name:pname,score:ok,secs}).then(()=>{shown=true;render()})}
function reset(){
  clearInterval(timer);state='idle';$('main').classList.remove('run');cur=null;
  cells.forEach(c=>{c.value='';c.disabled=true;c.classList.remove('ok','bad')});
  shown=false;mineKey=null;$('rank').style.display='none';$('nm').disabled=false;
  $('start').disabled=false;$('mins').disabled=false;$('cancel').disabled=true;$('cancel').textContent='Terminar';
  $('clock').textContent='00:00';$('score').textContent='– / 144';$('msg').textContent='¡Completa la tabla de multiplicar!'}
$('cancel').onclick=()=>{state==='running'?finish():reset()};
</script>
</body>
</html>
